# Host nginx vhost for https://creator.vstu.pitrontech.et
# Proxies ONLY to vstu-creator on 127.0.0.1:3082 — not Prime Capital (3819) or other apps.

server {
    server_name creator.vstu.pitrontech.et;

    location / {
        proxy_pass         http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    listen 80;
}
