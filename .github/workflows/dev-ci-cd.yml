name: Dev CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  DEPLOY_PATH: /opt/vstu-creator-dev
  REGISTRY: registry.dev.vstu.et
  IMAGE_NAME: registry.dev.vstu.et/vstu-creator
  HOST_PORT: '3082'
  VITE_API_BASE_URL: https://api.dev.vstu.et/api

jobs:
  ci:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to dev server
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    env:
      SSH_HOST: '196.189.61.146'
      SSH_USER: 'charteredadmin'
      SSH_PORT: '22'
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CONFIG
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CONFIG

      - name: Check deploy directory
        run: |
          ssh deploy "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH'" || {
            echo "::error::$DEPLOY_PATH must exist and be writable by $SSH_USER (sudo mkdir -p $DEPLOY_PATH && sudo chown $SSH_USER: $DEPLOY_PATH)"
            exit 1
          }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: 'meda-ci'
          password: '48ed1f96a5cb9ebe817e3209c328c49292496e53532d4504'

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=vstu-creator
          cache-to: type=gha,scope=vstu-creator,mode=max

      - name: Upload compose file
        run: scp docker-compose.yml "deploy:$DEPLOY_PATH/docker-compose.yml"

      - name: Write .env
        run: |
          printf 'IMAGE_NAME=%s\nIMAGE_TAG=%s\nHOST_PORT=%s\n' "$IMAGE_NAME" "$IMAGE_TAG" "$HOST_PORT" \
            | ssh deploy "cat > '$DEPLOY_PATH/.env'"

      - name: Pull image & restart container
        env:
          REGISTRY_USERNAME: 'meda-ci'
          REGISTRY_PASSWORD: '48ed1f96a5cb9ebe817e3209c328c49292496e53532d4504'
        run: |
          printf '%s' "$REGISTRY_PASSWORD" | ssh deploy "docker login '$REGISTRY' -u '$REGISTRY_USERNAME' --password-stdin"
          ssh deploy "cd '$DEPLOY_PATH' && docker compose pull web && docker compose up -d --no-build --remove-orphans"

      - name: Wait for web to be healthy
        run: |
          ssh deploy "cd '$DEPLOY_PATH' && bash -s" <<'EOF2'
          set -e
          id=$(docker compose ps -q web)
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$id")
            echo "web: $status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 10
          done
          echo "::error::Web did not become healthy"
          docker compose ps
          docker compose logs --tail=100 web
          exit 1
          EOF2

      - name: Clean up old images
        if: success()
        run: ssh deploy "docker image prune -f"

      - name: Clean up runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
