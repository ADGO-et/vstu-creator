name: CI/CD — Prod Deploy (main)

# Deploys on:
# - direct pushes to main
# - PR merges into main (GitHub emits a push event on merge)
# - manual "Run workflow" from the Actions tab
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vstu-creator-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adgo-et/vstu-creator
  FULL_IMAGE: ghcr.io/adgo-et/vstu-creator
  # Isolated from other apps on ecs-velnet2 (student 3080, admin 3081, etc.)
  # NOTE: was vstu-creator-dev / tag "dev" when this pipeline ran on test-env.
  # The live container on .55 still uses that old project name - it will be
  # orphaned (left running under its old name) the first time this runs
  # against main until someone cleans it up with the old COMPOSE_PROJECT.
  DEPLOY_PATH: /opt/vstu-creator
  COMPOSE_PROJECT: vstu-creator
  IMAGE_TAG: prod

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=raw,value=prod
            type=sha,prefix=,format=short

      - name: Require VITE_API_BASE_URL secret
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Missing secret VITE_API_BASE_URL."
            echo "Add it under: Settings → Secrets and variables → Actions"
            echo "OR under: Settings → Environments → development"
            echo "Same backend as student/admin — must include /api, e.g. https://vstu.pitrontech.et/api"
            exit 1
          fi
          echo "VITE_API_BASE_URL secret is set (value hidden)."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    name: Deploy Prod to Ubuntu Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: '196.190.251.55'
      SSH_USER: 'root'
      SSH_PORT: '22'
      HOST_PORT: '3082'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CONFIG
          Host deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CONFIG

      - name: Deploy via SSH (server pulls image — no slow image upload)
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
          FULL_IMAGE: ${{ env.FULL_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Deploying ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          test -f docker-compose.yml || { echo "docker-compose.yml missing in workspace"; ls -la; exit 1; }

          ssh deploy "mkdir -p ${DEPLOY_PATH}"
          scp docker-compose.yml "deploy:${DEPLOY_PATH}/docker-compose.yml"

          ssh deploy \
            "GHCR_USER=$(printf %q "$GHCR_USER") GHCR_TOKEN=$(printf %q "$GHCR_TOKEN") FULL_IMAGE=$(printf %q "$FULL_IMAGE") IMAGE_TAG=$(printf %q "$IMAGE_TAG") DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") COMPOSE_PROJECT=$(printf %q "$COMPOSE_PROJECT") APP_PORT=$(printf %q "$HOST_PORT") bash -s" <<'EOF'
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "${FULL_IMAGE}:${IMAGE_TAG}"
          cd "$DEPLOY_PATH"
          printf '%s\n' \
            "IMAGE_NAME=${FULL_IMAGE}" \
            "IMAGE_TAG=${IMAGE_TAG}" \
            "HOST_PORT=${APP_PORT}" \
            > .env
          docker compose -p "$COMPOSE_PROJECT" up -d
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF

      - name: Health check
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
          HOST_PORT: ${{ env.HOST_PORT }}
        run: |
          ssh deploy "cd '$DEPLOY_PATH' && bash -s" <<EOF2
          set -e
          echo "Waiting for vstu-creator-web health..."
          for i in \$(seq 1 20); do
            status="\$(docker inspect --format='{{.State.Health.Status}}' vstu-creator-web 2>/dev/null || echo starting)"
            if [ "\$status" = "healthy" ]; then
              echo "vstu-creator prod is healthy on 127.0.0.1:${HOST_PORT}"
              docker compose -p "$COMPOSE_PROJECT" ps
              exit 0
            fi
            sleep 3
          done
          echo "Health check timed out (other server containers were not touched)"
          docker compose -p "$COMPOSE_PROJECT" logs --tail=100
          exit 1
          EOF2

      - name: Clean up runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
