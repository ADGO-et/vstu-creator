name: CI/CD — Dev Deploy (test-env)

on:
  push:
    branches: [test-env]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adgo-et/vstu-creator
  FULL_IMAGE: ghcr.io/adgo-et/vstu-creator
  # Isolated from other apps on ecs-velnet2 (student 3080, admin 3081, etc.)
  DEPLOY_PATH: /opt/vstu-creator-dev
  COMPOSE_PROJECT: vstu-creator-dev
  IMAGE_TAG: dev

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE }}
          tags: |
            type=raw,value=dev
            type=raw,value=test-env
            type=sha,prefix=,format=short

      - name: Require VITE_API_BASE_URL secret
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Missing secret VITE_API_BASE_URL."
            echo "Add it under: Settings → Secrets and variables → Actions"
            echo "OR under: Settings → Environments → development"
            echo "Same backend as student/admin — must include /api, e.g. https://vstu.pitrontech.et/api"
            exit 1
          fi
          echo "VITE_API_BASE_URL secret is set (value hidden)."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  deploy:
    name: Deploy Dev to Ubuntu Server
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          missing=0
          [ -n "$SSH_HOST" ] || { echo "Missing SSH_HOST"; missing=1; }
          [ -n "$SSH_USER" ] || { echo "Missing SSH_USER"; missing=1; }
          [ -n "$SSH_PASSWORD" ] || { echo "Missing SSH_PASSWORD"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add SSH_* secrets in repo or development environment."
            exit 1
          fi

      - name: Deploy via SSH (server pulls image — no slow image upload)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          HOST_PORT: ${{ secrets.HOST_PORT }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
          FULL_IMAGE: ${{ env.FULL_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "Deploying ref=${GITHUB_REF_NAME} sha=${GITHUB_SHA}"
          test -f docker-compose.yml || { echo "docker-compose.yml missing in workspace"; ls -la; exit 1; }

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          PORT="${SSH_PORT:-22}"
          APP_PORT="${HOST_PORT:-3082}"

          export SSHPASS="${SSH_PASSWORD}"
          SSH_BASE_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          sshpass -e ssh ${SSH_BASE_OPTS} -p "${PORT}" \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p ${DEPLOY_PATH}"

          sshpass -e scp ${SSH_BASE_OPTS} -P "${PORT}" \
            docker-compose.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.yml"

          sshpass -e ssh ${SSH_BASE_OPTS} -p "${PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "GHCR_USER=$(printf %q "$GHCR_USER") GHCR_TOKEN=$(printf %q "$GHCR_TOKEN") FULL_IMAGE=$(printf %q "$FULL_IMAGE") IMAGE_TAG=$(printf %q "$IMAGE_TAG") DEPLOY_PATH=$(printf %q "$DEPLOY_PATH") COMPOSE_PROJECT=$(printf %q "$COMPOSE_PROJECT") APP_PORT=$(printf %q "$APP_PORT") bash -s" <<'EOF'
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "${FULL_IMAGE}:${IMAGE_TAG}"
          cd "$DEPLOY_PATH"
          printf '%s\n' \
            "IMAGE_NAME=${FULL_IMAGE}" \
            "IMAGE_TAG=${IMAGE_TAG}" \
            "HOST_PORT=${APP_PORT}" \
            > .env
          docker compose -p "$COMPOSE_PROJECT" up -d
          docker logout ghcr.io >/dev/null 2>&1 || true
          EOF

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        env:
          HOST_PORT: ${{ secrets.HOST_PORT }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: HOST_PORT,DEPLOY_PATH,COMPOSE_PROJECT
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "Waiting for vstu-creator-web health..."
            for i in $(seq 1 20); do
              status="$(docker inspect --format='{{.State.Health.Status}}' vstu-creator-web 2>/dev/null || echo starting)"
              if [ "$status" = "healthy" ]; then
                echo "vstu-creator-dev is healthy on 127.0.0.1:${HOST_PORT:-3082}"
                docker compose -p "$COMPOSE_PROJECT" ps
                exit 0
              fi
              sleep 3
            done
            echo "Health check timed out (other server containers were not touched)"
            docker compose -p "$COMPOSE_PROJECT" logs --tail=100
            exit 1
